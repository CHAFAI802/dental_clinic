server {

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;


    # API Django
    location /api/ {

        proxy_pass http://web:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }


    # Administration Django
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {

        proxy_pass http://web:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }


    # Fichiers statiques Django
    location ^~ /static/ {

        alias /usr/share/nginx/static/;

        access_log off;
        expires 7d;
    }


    # Images publiques du site uniquement
    location ^~ /media/site-images/ {
        alias /usr/share/nginx/media/site-images/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Tous les autres médias restent inaccessibles
    location ^~ /media/ {
        return 404;
    }


    # Application React et routes SPA
    location / {

        try_files $uri $uri/ /index.html;
    }
}
